<!doctype html>
<!--
  Banc de test hors AR.
  Verifie l'invariant central de l'app : quel que soit le detourage du PNG,
  le SUJET mesure exactement `height` metres et ses pieds sont a y = 0.
  Lance par tests/run.mjs (Playwright), sans camera ni moteur 8th Wall.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Test — echelle reelle</title>
    <link rel="icon" href="data:," />
    <script src="/external/aframe/aframe.min.js"></script>
  </head>
  <body>
    <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false">
      <a-entity id="figure" real-scale-figure></a-entity>
      <a-entity id="shadow" contact-shadow></a-entity>
    </a-scene>

    <script type="module">
      import '/src/components/real-scale-figure.js'
      import '/src/components/contact-shadow.js'
      import {pickGroundHit, createFloorEstimator} from '/src/lib/hit-test.js'
      import {setCorrection} from '/src/lib/scale.js'

      const results = []
      const near = (a, b, eps = 1e-3) => Math.abs(a - b) <= eps
      const check = (name, ok, got) => results.push({name, ok: !!ok, got})

      const run = async () => {
        // scale.js demarre avec CONFIG.slamScaleCorrection (une valeur de
        // terrain, arbitraire du point de vue des tests). Les tests de
        // filtrage de hit ci-dessous raisonnent en unites 1:1 -> on fixe la
        // correction a 1 explicitement, pour ne pas dependre de ce que vaut
        // le defaut de config a un instant donne. Le test 14 la fait varier
        // volontairement plus bas, et la remet a 1 en sortie.
        setCorrection(1)

        const figure = document.getElementById('figure')

        await new Promise((resolve) => {
          figure.addEventListener('figure-ready', resolve, {once: true})
          figure.setAttribute('real-scale-figure', {
            src: '/players/placeholder.png',
            height: 1.8,
          })
        })

        const mesh = figure.getObject3D('mesh')

        // 1. Hauteur du sujet = hauteur demandee (marges transparentes exclues).
        const dims = figure.components['real-scale-figure'].dimensions
        check('hauteur du sujet = 1.80 m', near(dims.height, 1.8), dims.height)

        // 2. Pieds au sol : bas du decoupage exactement a y = 0.
        const padBelow = (mesh.scale.y - dims.height) / 2
        const bottom = mesh.position.y - mesh.scale.y / 2 + padBelow
        check('semelles a y = 0', near(bottom, 0), bottom)

        // 3. Sommet du crane a exactement 1.80 m.
        const top = mesh.position.y + mesh.scale.y / 2 - padBelow
        check('sommet a y = 1.80 m', near(top, 1.8), top)

        // 4. Ratio conserve : le PNG source fait 753 x 2161 px de zone opaque.
        check(
          'ratio largeur/hauteur conserve',
          near(dims.width / dims.height, 753 / 2161, 5e-3),
          dims.width / dims.height
        )

        // 5. calibration = 0.9 doit produire un sujet de 1.62 m.
        await new Promise((resolve) => {
          figure.addEventListener('figure-ready', resolve, {once: true})
          figure.setAttribute('real-scale-figure', 'calibration', 0.9)
        })
        check(
          'calibration 0.9 -> 1.62 m',
          near(figure.components['real-scale-figure'].dimensions.height, 1.62),
          figure.components['real-scale-figure'].dimensions.height
        )

        // 5b. correction (biais SLAM) = 0.5 en plus de calibration 0.9 -> 0.81 m.
        // C'est le mecanisme qui corrige une echelle absolue mal calibree par
        // le moteur (voir CONFIG.slamScaleCorrection) : il doit se composer
        // avec `calibration`, pas la remplacer.
        await new Promise((resolve) => {
          figure.addEventListener('figure-ready', resolve, {once: true})
          figure.setAttribute('real-scale-figure', 'correction', 0.5)
        })
        check(
          'correction 0.5 x calibration 0.9 -> 0.81 m',
          near(figure.components['real-scale-figure'].dimensions.height, 0.81),
          figure.components['real-scale-figure'].dimensions.height
        )
        figure.setAttribute('real-scale-figure', 'correction', 1)
        figure.setAttribute('real-scale-figure', 'calibration', 1)

        // 6. Selection du hit : la surface detectee prime sur le point de feature.
        const hits = [
          {type: 'FEATURE_POINT', position: {x: 0, y: -1.5, z: -2}, distance: 2},
          {type: 'DETECTED_SURFACE', position: {x: 0, y: -1.6, z: -3}, distance: 3},
          {type: 'ESTIMATED_SURFACE', position: {x: 0, y: -1.55, z: -2.5}, distance: 2.5},
        ]
        check('hit : surface detectee prioritaire', pickGroundHit(hits, 0).type === 'DETECTED_SURFACE')

        // 7. Un hit trop haut par rapport a la camera (mur, plan de travail)
        //    est rejete : 40 cm sous une camera a 1,60 m n'est pas du sol.
        check(
          'hit trop haut sous la camera rejete',
          pickGroundHit([{type: 'FEATURE_POINT', position: {x: 0, y: 1.2, z: -2}, distance: 2}], 1.6) === null
        )

        // 8. Un hit trop lointain est rejete.
        check(
          'hit a 40 m rejete',
          pickGroundHit([{type: 'FEATURE_POINT', position: {x: 0, y: -1.6, z: -40}, distance: 40}], 0) === null
        )

        // 9. Stabilisation du sol : un ecart de quelques cm est aligne.
        const floor = createFloorEstimator()
        floor.snap(-1.6)
        const snapped = floor.snap(-1.68)
        check('sol stabilise (ecart 8 cm)', Math.abs(snapped - -1.6) < 0.02, snapped)

        // 10. Un vrai changement de niveau est suivi.
        const jumped = floor.snap(-1.0)
        check('changement de niveau suivi', near(jumped, -1.0), jumped)

        // 11. Sol connu a -1.60 m : une table a -0.85 m est refusee...
        const table = [{type: 'DETECTED_SURFACE', position: {x: 0, y: -0.85, z: -2}, distance: 2}]
        check('table refusee quand le sol est connu', pickGroundHit(table, 0.0, -1.6) === null)

        // ...alors qu'elle serait acceptee sans niveau de sol de reference.
        check('table acceptee sans sol de reference', pickGroundHit(table, 0.0, null) !== null)

        // 12. findGroundHit : le point exact vise ne rend rien (sol non
        // texture a ce pixel precis), mais un point du voisinage immediat en
        // rend un -> ca doit quand meme reussir. C'est le coeur du correctif
        // pour "je vise le sol mais rien ne se pose jamais" sur les sols peu
        // texturés/repetitifs (carrelage...).
        const {findGroundHit} = await import('/src/lib/hit-test.js')
        window.XR8 = {
          XrController: {
            hitTest: (x, y) => {
              const onTarget = Math.abs(x - 0.53) < 0.001 && Math.abs(y - 0.5) < 0.001
              return onTarget ? [{type: 'FEATURE_POINT', position: {x: 0, y: -1.6, z: -2}, distance: 2}] : []
            },
          },
        }
        check('point exact sans hit -> aucun resultat direct', pickGroundHit([], 0) === null)
        check('findGroundHit trouve un hit dans le voisinage', findGroundHit(0.5, 0.5, 0) !== null)
        check('findGroundHit : aucun hit nulle part -> null', findGroundHit(0.1, 0.1, 0) === null)
        delete window.XR8

        // 13. intersectFloorPlane : remplace le hitTest une fois floor.level
        // connu -> pure geometrie (rayon camera/tap x plan du sol), donc
        // insensible a la texture du sol a l'endroit precis vise. C'est ce
        // qui rend le placement fiable sur un carrelage uni (plus de rond
        // vert requis).
        const {intersectFloorPlane} = await import('/src/lib/hit-test.js')
        const THREE = AFRAME.THREE

        const camDown = new THREE.PerspectiveCamera(60, 1, 0.1, 100)
        camDown.position.set(0, 1.6, 0)
        camDown.rotation.set(-Math.PI / 2, 0, 0) // vise droit vers le bas
        camDown.updateMatrixWorld(true)
        const floorHit = intersectFloorPlane(0.5, 0.5, camDown, 0)
        check(
          'intersectFloorPlane : vise droit vers le bas -> atterrit au niveau du sol',
          floorHit && near(floorHit.position.y, 0, 1e-3),
          floorHit && floorHit.position.y
        )
        check(
          'intersectFloorPlane : atterrit juste sous la camera (x,z ~ 0)',
          floorHit && near(Math.hypot(floorHit.position.x, floorHit.position.z), 0, 1e-3),
          floorHit && floorHit.position
        )

        const camLevel = new THREE.PerspectiveCamera(60, 1, 0.1, 100)
        camLevel.position.set(0, 1.6, 0) // orientation par defaut : horizontale (-Z)
        camLevel.updateMatrixWorld(true)
        check(
          'intersectFloorPlane : vise a l\'horizontale (au-dessus du sol) -> null',
          intersectFloorPlane(0.5, 0.5, camLevel, 0) === null
        )

        const camFar = new THREE.PerspectiveCamera(60, 1, 0.1, 200)
        camFar.position.set(0, 1.6, 0)
        camFar.rotation.set(-Math.PI / 2, 0, 0)
        camFar.updateMatrixWorld(true)
        check(
          'intersectFloorPlane : sol au-dela de maxPlacementDistance -> null',
          intersectFloorPlane(0.5, 0.5, camFar, -50) === null
        )

        // 14. Les seuils de distance suivent `correction` (src/lib/scale.js) :
        // sinon un moteur a k=0.5 exigerait 1,2 m reels la ou la config
        // annonce 0,6 m. Note : `correction` n'est plus DERIVEE d'une lecture
        // camera (methode abandonnee, voir scale.js) — elle est fixee a la
        // main par comparaison visuelle. Ce test verifie seulement que la
        // conversion metres-reels -> unites-de-scene fonctionne, quelle que
        // soit l'origine du chiffre.
        const {m: toScene} = await import('/src/lib/scale.js')
        setCorrection(0.5)
        check('seuil 0.6 m reel -> 0.30 unite de scene', near(toScene(0.6), 0.3), toScene(0.6))
        // Un hit 0,40 unite sous la camera = 0,80 m reel : accepte a k=0.5,
        // alors qu'il serait rejete si le seuil n'etait pas converti.
        const lowHit = [{type: 'FEATURE_POINT', position: {x: 0, y: 0.6, z: -2}, distance: 2}]
        check('hit accepte grace au seuil converti', pickGroundHit(lowHit, 1.0) !== null)
        setCorrection(1)
        check('hit rejete sans conversion (k=1)', pickGroundHit(lowHit, 1.0) === null)

        window.__RESULTS__ = results
      }

      const scene = document.querySelector('a-scene')
      if (scene.hasLoaded) run()
      else scene.addEventListener('loaded', run, {once: true})
    </script>
  </body>
</html>
